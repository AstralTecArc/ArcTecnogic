<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="Imagens/Logo-Aba.png"><!--Logo na Aba-->
    <title>Arc Tecnologic</title> <!--Nome na Aba-->
    <link rel="stylesheet" href="style.css"> <!--Interligando o Css-->
</head>

<body>

    <!--Logo TopBar-->
    <header class="topbar">

        <div class="logo-topbar">
            <img src="Imagens/Tec-Arc.png" alt="Arc_Tecnologic"><!-- Imagem da Logo no topo da aba-->
        </div>

    </header>

    <!--Menu Lateral Esquerdo-->
    <aside class="sidebar">

        <div class="logo-sidebar">
            <img src="Imagens/Logo-Aba.png" alt="logo-sidebar"><!--Logo na Barra lateral-->
        </div>

        <!--Botões da categorias-->
        <nav>
            <button class="menu-item active" data-view="computadores"><!--Botão de Categorias-->
                Computadores
            </button>

            <button class="menu-item" data-view="hardware"><!--Botão Hardware-->
                Hardware
            </button>

            <button class="menu-item" data-view="perifericos"><!--Botão Periféricos-->
                Periféricos
            </button>

            <button class="menu-item" data-view="monitores"><!--Botão Monitores-->
                Monitores
            </button>

        </nav>
        <br>

        <!--Área do usuário-->
        <nav>
            <button class="menu-item" data-view="itens-comprados"><!--Botão de itens Comprados-->
                Minhas Compras
            </button>

            <button class="menu-item" data-view="carrinho"><!--Botão Carrinho-->
                Meu Carrinho
            </button>

            <button class="menu-item" data-view="conta"><!--Botão Perfil-->
                Conta
            </button>

        </nav>
    </aside>

    <!--Painel Central-->

    <section class="page" id="computadores"><!--Grid de Produtos-->
        <div class="product-grid">

            <article class="product-card">
                <img src="Imagens/Pcgamer.png" alt="PC Gamer">
                <h3>Nome do computador</h3>
                <p>16GB RAM · SSD 500GB</p>
                <strong>R$ 3.999,00</strong>
                <button>Adicionar ao carrinho</button>
            </article>
        </div>
    </section>

    <main class="main-content">
        <h2 id="page-title">Computadores</h2>

        <section class="page" id="computadores">
            <h1>Computadores</h1>
        </section>

        <section class="page" id="hardware" hidden>
            <h1>Hardware</h1>
        </section>

        <section class="page" id="perifericos" hidden>
            <h1>Periféricos</h1>
        </section>

        <section class="page" id="monitores" hidden>
            <h1>Monitores</h1>
        </section>

        <section class="page" id="itens-comprados" hidden>
            <h1>Minhas Compras</h1>
        </section>

        <section class="page" id="carrinho" hidden>
            <h1>Meu Carrinho</h1>
        </section>

        <section class="page" id="conta" hidden>
            <h1>Conta</h1>
        </section>

    </main>
    <p style="color: rgb(255, 200, 0); text-align: center;">©Arc Tecnologic - Álex Nery</p>
    <script src="script.js"></script>
</body>

</html>
